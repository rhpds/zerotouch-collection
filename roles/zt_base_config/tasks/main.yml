---
- name: Assert required variables are set
  ansible.builtin.assert:
    that:
      - zt_base_config_content_git_repo | default('') | length > 0
      - guid | default('') | length > 0
    fail_msg: >-
      zt_base_config requires zt_base_config_content_git_repo (or
      ocp4_workload_showroom_content_git_repo) and guid to be set.
    quiet: true

- name: Assert content repo URL matches the expected GitHub .git shape
  ansible.builtin.assert:
    that:
      - zt_base_config_content_git_repo is match('^https://github\.com/.+\.git$')
    fail_msg: >-
      zt_base_config_content_git_repo ({{ zt_base_config_content_git_repo }})
      must be an https://github.com/<org>/<repo>.git URL; other hosts or a
      missing .git suffix are not supported.
    quiet: true

- name: Compute the raw githubusercontent config directory URL
  ansible.builtin.set_fact:
    zt_base_config_git_config_directory: >-
      {{ zt_base_config_content_git_repo
        | replace('.git', '/' + zt_base_config_content_git_repo_ref + '/config/')
        | replace('github.com', 'raw.githubusercontent.com') }}
    cacheable: true

- name: Fetch firewall.yaml from the content repo
  ansible.builtin.uri:
    url: "{{ zt_base_config_git_config_directory + zt_base_config_firewall_file }}"
    return_content: true
    status_code: "{{ [200] if zt_base_config_lookup_errors == 'strict' else [200, 404] }}"
  register: r_zt_base_config_firewall
  retries: "{{ zt_base_config_fetch_retries }}"
  delay: "{{ zt_base_config_fetch_delay }}"
  until: r_zt_base_config_firewall is not failed

- name: Warn that firewall.yaml was not found
  ansible.builtin.debug:
    msg: >-
      firewall.yaml not found at
      {{ zt_base_config_git_config_directory }}{{ zt_base_config_firewall_file }};
      continuing with no extra lockdown rules from this file.
  when:
    - r_zt_base_config_firewall.status == 404
    - zt_base_config_lookup_errors == 'warn'

- name: Parse firewall.yaml (tolerate a missing file)
  ansible.builtin.set_fact:
    _zt_base_config_firewall: >-
      {{ (r_zt_base_config_firewall.content | from_yaml)
        if r_zt_base_config_firewall.status == 200 else {} }}

- name: Fetch instances.yaml from the content repo
  ansible.builtin.uri:
    url: "{{ zt_base_config_git_config_directory + zt_base_config_instances_file }}"
    return_content: true
    status_code: [200]
  register: r_zt_base_config_instances
  retries: "{{ zt_base_config_fetch_retries }}"
  delay: "{{ zt_base_config_fetch_delay }}"
  until: r_zt_base_config_instances is not failed

- name: Parse instances.yaml
  ansible.builtin.set_fact:
    _zt_base_config_instances_file_content: >-
      {{ (r_zt_base_config_instances.content | replace('INSTANCEGUID', guid)) | from_yaml }}

# Some BUs' content repos (confirmed: every real Ansible BU lab checked so far -
# zt-ans-bu-dev-tools, zt-ans-bu-eda-netbox, zt-ans-bu-windows-ad,
# zt-ans-bu-windows90) tag their access VM `AnsibleGroup: isolated` only, never
# `bastions`. cloud-vms-base/openshift_cnv treats `isolated` as a reserved
# exclusion group (same tier as windows/network - see workloads.yml and
# infrastructure_deployment.yml's `all:!windows:!network:!isolated` host
# patterns), so that VM would otherwise get no SSH/wait-for-connection and no
# control_user/asset_injector at all.
#
# Live-tested against a real ocpvdev01 order (GPTEINFRA-17763, guid hcshc):
# an earlier version of this fixup only *prepended* "bastions," while keeping
# "isolated" (mirroring cloud-vms-base's own "bastions,showroom" bastion
# convention). That got the VM correctly targeted by `bastions:`-scoped
# workload plays (pre_software_workloads.bastions ran control_user/
# asset_injector successfully), but SSH itself still failed with
# "Could not resolve hostname vscode" - because "Step 001.3 Configure Linux
# hosts and wait for connection" (`hosts: all:!windows:!network:!isolated`)
# is what actually sets `ansible_ssh_extra_args: -F <generated ssh_config>`,
# and it's excluded ANY host still tagged isolated, even if also tagged
# bastions. Without that fact set, Ansible fell back to a raw `ssh vscode`
# with no `-F` flag, and the bare hostname doesn't resolve outside the
# generated per-guid ssh_config's Host alias. Fixed by dropping "isolated"
# from the tag entirely (not just adding "bastions" alongside it) - see
# below. ansible.builtin.add_host's comma-splitting `groups:` behavior
# (confirmed against ansible-core source) is what makes plain "bastions"
# alone still work for every other purpose.
- name: Collect this lab's parsed VM list for the bastion-group fixup
  ansible.builtin.set_fact:
    _zt_base_config_vms: "{{ _zt_base_config_instances_file_content.virtualmachines | default([], true) }}"

- name: Determine whether any parsed VM already carries "bastions" in its AnsibleGroup tag
  ansible.builtin.set_fact:
    _zt_base_config_has_bastion_tag: >-
      {{ (_zt_base_config_vms
        | map(attribute='tags', default=[])
        | flatten
        | selectattr('key', 'equalto', 'AnsibleGroup')
        | map(attribute='value')
        | select('search', 'bastions')
        | list
        | length) > 0 }}

# Default false (not true): making this opt-in, rather than defaulting to
# silently rewriting a content author's own tags, is a deliberate reversal
# from an earlier version of this role. Confirmed live TWICE
# (GPTEINFRA-17763, guids 62n8j/bfvrx for zt-ans-bu-eda-netbox and d9v4h for
# zt-ans-bu-windows-ad) that defaulting to true actively breaks
# content that was already working correctly under v1: both repos tag
# every VM isolated-only *on purpose* (no VM is meant to be Ansible-managed
# at all - access is purely via showroom's per-VM wetty sidecars using
# each VM's own cloud-init-baked creds), and the old true-default promoted
# their first VM ("control") out of isolated into bastions regardless,
# pulling it into cloud-vms-base's generic cloud-user-based connection
# setup - which "control" cannot support (no cloud-user account on that
# image). v1 never did this kind of tag-rewriting at all. A content repo
# that genuinely needs a real Ansible-managed bastion (e.g.
# zt-ans-bu-dev-tools, a single-VM lab needing groups['bastions'][0] to
# resolve) should tag that VM AnsibleGroup: bastions directly in its own
# config/instances.yaml - this role's fixup is an escape hatch for
# catalog authors who can't or don't want to touch the content repo
# itself, not a silent default behavior.
- name: Report the bastion-group decision for this lab
  vars:
    _zt_base_config_msg_has_bastion: >-
      At least one VM already tags AnsibleGroup: bastions - zt_base_config_ensure_bastion_group has no effect.
    _zt_base_config_msg_no_vms: >-
      No VMs parsed from instances.yaml - zt_base_config_ensure_bastion_group has no effect.
    _zt_base_config_msg_promoting: >-
      No VM tags AnsibleGroup: bastions, and zt_base_config_ensure_bastion_group is true - promoting
      "{{ _zt_base_config_vms[0].name | default('the first VM') }}" to bastions (dropping isolated if present).
    _zt_base_config_msg_default_noop: >-
      No VM tags AnsibleGroup: bastions. zt_base_config_ensure_bastion_group is false (the default) - leaving
      every VM's tags as-is; all VMs stay excluded from cloud-vms-base's generic Linux host pipeline. If this
      lab needs an Ansible-managed bastion (e.g. for wait_for_connection, control_user/asset_injector, or a
      catalog Jinja expression reading groups['bastions'][0]), either tag the right VM AnsibleGroup: bastions
      in this repo's own config/instances.yaml, or set zt_base_config_ensure_bastion_group: true for this
      catalog item.
  ansible.builtin.debug:
    msg: >-
      {{ _zt_base_config_msg_has_bastion if _zt_base_config_has_bastion_tag
        else _zt_base_config_msg_no_vms if (_zt_base_config_vms | length == 0)
        else _zt_base_config_msg_promoting if (zt_base_config_ensure_bastion_group | default(false) | bool)
        else _zt_base_config_msg_default_noop }}

- name: Ensure at least one VM's AnsibleGroup tag includes "bastions"
  when:
    - zt_base_config_ensure_bastion_group | default(false) | bool
    - _zt_base_config_vms | length > 0
    - not _zt_base_config_has_bastion_tag
  block:
    - name: Split the first VM's existing AnsibleGroup tag value from its other tags
      ansible.builtin.set_fact:
        _zt_base_config_first_vm_other_tags: >-
          {{ (_zt_base_config_vms[0].tags | default([]))
            | rejectattr('key', 'equalto', 'AnsibleGroup')
            | list }}
        # Split on comma and drop "isolated" specifically (not "windows"/
        # "network" - a VM genuinely tagged one of those is presumably not
        # meant to be treated as a generic Linux bastion at all, so this
        # fixup shouldn't force it into that role). Any other coexisting
        # token is preserved.
        _zt_base_config_first_vm_group_tokens: >-
          {{ (((_zt_base_config_vms[0].tags | default([]))
            | selectattr('key', 'equalto', 'AnsibleGroup')
            | map(attribute='value')
            | list | first) | default('')).split(',')
            | reject('equalto', '')
            | reject('equalto', 'isolated')
            | list }}

    - name: Patch the first VM's AnsibleGroup tag to be "bastions" (dropping "isolated" specifically)
      ansible.builtin.set_fact:
        _zt_base_config_instances_file_content: >-
          {{ _zt_base_config_instances_file_content
            | combine({'virtualmachines':
              ([_zt_base_config_vms[0]
                | combine({'tags': _zt_base_config_first_vm_other_tags +
                  [{'key': 'AnsibleGroup',
                    'value': (['bastions'] + _zt_base_config_first_vm_group_tokens) | join(',')}]})]
                + _zt_base_config_vms[1:]) }) }}

- name: Fetch networks.yaml from the content repo
  ansible.builtin.uri:
    url: "{{ zt_base_config_git_config_directory + zt_base_config_networks_file }}"
    return_content: true
    status_code: [200]
  register: r_zt_base_config_networks
  retries: "{{ zt_base_config_fetch_retries }}"
  delay: "{{ zt_base_config_fetch_delay }}"
  until: r_zt_base_config_networks is not failed

- name: Parse networks.yaml
  ansible.builtin.set_fact:
    _zt_base_config_networks_file_content: "{{ r_zt_base_config_networks.content | from_yaml }}"

- name: Publish computed Zero Touch config as cacheable facts
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
    cacheable: true
  loop:
    - key: zero_touch_egress_lockdown_rules
      value: "{{ _zt_base_config_firewall.egress | default([], true) }}"
    - key: zero_touch_ingress_lockdown_rules
      value: "{{ _zt_base_config_firewall.ingress | default([], true) }}"
    - key: containers
      value: "{{ _zt_base_config_instances_file_content.containers | default([], true) }}"
    - key: instances
      value: "{{ _zt_base_config_instances_file_content.virtualmachines | default([], true) }}"
    - key: networks
      value: "{{ _zt_base_config_networks_file_content | default([], true) }}"
  loop_control:
    label: "{{ item.key }}"
