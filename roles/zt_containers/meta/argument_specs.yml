---
argument_specs:
  main:
    short_description: >-
      Provision the Zero Touch containers: sidecar list as one Deployment
      per entry (or per pod: group), with optional Service/Route exposure
      and one-time init commands.
    description: >-
      New capability (not a port of any v1 role — see the migration
      proposal's Risk #1: `containers:` support is unfinished in v1 too).
      Reads the `containers` list (typically produced by zt_base_config from
      a lab's instances.yaml) and, for ACTION in [provision, create], creates
      one apps/v1 Deployment per entry (or, for entries that share a pod:
      value, one Deployment per group with multiple containers in its Pod
      template) plus any declared v1/Service and route.openshift.io/v1/Route
      objects. For ACTION in [destroy, remove], deletes the same objects.
      Schema and field names for a containers[] entry match Kubernetes' own
      PodSpec fields directly (ports, volumeMounts, volumes) so no
      translation layer is needed, based on the one confirmed-real example:
      https://github.com/rhpds/zt-ans-bu-eda-netbox/blob/main/config/instances.yaml.
      Note: sandbox_openshift_apps_domain (not an option of this role — it's
      expected to already be set by the sandbox/CNV setup) is required
      whenever any containers[].routes entry is declared, since it's used to
      build each Route's host.
    options:
      containers:
        type: list
        elements: dict
        default: []
        description: List of sidecar containers to provision.
        options:
          name:
            type: str
            required: true
            description: Container/Deployment/Pod-label name.
          pod:
            type: str
            description: >-
              Optional pod-group name. Entries sharing the same pod: value
              are bundled into one Deployment/Pod together (one containers:
              entry per member), sharing the Pod's network namespace
              (reachable over localhost, no Service needed) and any
              declared volumes: (define the shared volume once on any one
              member, then reference it from each member's volumeMounts:
              by name). When unset, defaults to this entry's own name -
              i.e. a group of one, identical to giving every container its
              own Deployment (today's behavior). Containers bundled into
              the same pod must each listen on a distinct port - the OS
              will refuse a second bind to the same port since they share
              one network namespace, and this is not validated by the role.
          image:
            type: str
            required: true
            description: Container image reference.
          ports:
            type: list
            elements: dict
            description: >-
              Kubernetes container ports (name/containerPort/protocol),
              passed through unchanged to the Pod spec.
          environment:
            type: dict
            description: >-
              Environment variables as a flat key/value dict, converted to
              the Kubernetes env: list internally. Values are coerced to
              strings (Kubernetes' EnvVar.value is a string field), so e.g.
              a YAML boolean or integer value is sent as its string form.
          volumeMounts:
            type: list
            elements: dict
            description: Kubernetes volumeMounts entries, passed through unchanged.
          volumes:
            type: list
            elements: dict
            description: Kubernetes pod volumes entries, passed through unchanged.
          commands:
            type: list
            elements: str
            description: >-
              Shell commands to exec once inside the running container after
              it becomes Ready (e.g. one-time database/user seeding).
          memory:
            type: str
            default: 256Mi
            description: Memory request and limit for the container.
          cpu:
            type: str
            description: >-
              CPU value for the container. When unset, defaults to a
              Burstable QoS shape (100m request / 500m limit). When set,
              the same value is used as both request and limit (Guaranteed
              QoS) - request and limit are not independently configurable.
          services:
            type: list
            elements: dict
            description: >-
              Services to create in front of this container, using the same
              shape as VM instances[].services (name/ports).
            options:
              name:
                type: str
                required: true
                description: Name of the Service object.
              ports:
                type: list
                elements: dict
                required: true
                description: >-
                  Kubernetes Service ports (name/port/targetPort/protocol),
                  passed through unchanged to the Service spec.
          routes:
            type: list
            elements: dict
            description: >-
              OpenShift Routes to create for this container's Services,
              using the same shape as VM instances[].routes
              (name/host/service/targetPort/tls/tls_termination).
            options:
              name:
                type: str
                required: true
                description: Name of the Route object.
              host:
                type: str
                required: true
                description: >-
                  Hostname prefix. The actual Route host is built by joining
                  this value with the deployment guid and the sandbox's apps
                  domain, in the form host-guid.apps_domain. Do not use
                  Jinja-style double-curly-brace placeholders in this
                  description: role argument_specs descriptions are templated
                  as task args before validate_argument_spec runs, so such
                  text would be evaluated for real and fail if the referenced
                  name is not an actual in-scope variable.
              service:
                type: str
                required: true
                description: Name of the Service this Route sends traffic to.
              targetPort:
                type: str
                required: true
                description: Target port on the Service to route traffic to.
              tls:
                type: bool
                default: false
                description: Whether to enable TLS termination on the Route.
              tls_termination:
                type: str
                default: edge
                description: >-
                  TLS termination type (edge/passthrough/reencrypt), only
                  used when tls is true.
      zt_containers_namespace:
        type: str
        required: true
        description: >-
          Namespace to create/remove containers in. Defaults to
          sandbox_openshift_namespace (the same namespace the CNV VMs
          already live in).
      zt_containers_openshift_api_url:
        type: str
        description: OpenShift API URL. Defaults to sandbox_openshift_api_url.
      zt_containers_openshift_api_key:
        type: str
        no_log: true
        description: OpenShift API token. Defaults to sandbox_openshift_api_key.
      zt_containers_validate_certs:
        type: bool
        default: false
        description: >-
          Whether to validate TLS certs on OpenShift API calls. Defaults to
          false for self-signed sandbox cluster CAs.
      zt_containers_wait_ready:
        type: bool
        default: true
        description: Wait for each Deployment to reach Available before continuing.
      zt_containers_wait_timeout:
        type: int
        default: 300
        description: Seconds to wait for each Deployment to become Available.
      zt_containers_k8s_retries:
        type: int
        default: 10
        description: >-
          Retries for each Kubernetes API call that creates or deletes a
          Deployment/Service/Route, to tolerate transient network/API
          failures.
      zt_containers_k8s_delay:
        type: int
        default: 5
        description: >-
          Delay in seconds between zt_containers_k8s_retries attempts. Also
          used as the polling interval when waiting for a container's pod to
          become Running before running its init commands (the number of
          polls is derived from zt_containers_wait_timeout).
      zt_containers_command_retries:
        type: int
        default: 10
        description: Retries for each one-time init command exec.
      zt_containers_command_delay:
        type: int
        default: 5
        description: Delay in seconds between init command exec retries.
