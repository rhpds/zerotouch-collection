---
- name: Assert container names are unique
  ansible.builtin.assert:
    that:
      - containers | map(attribute='name') | list | length
        == containers | map(attribute='name') | unique | list | length
    fail_msg: >-
      zt_containers requires each entry in containers[] to have a unique
      name; duplicate names would cause Deployments/pod lookups to collide.
    quiet: true

- name: Deploy each pod group as its own Deployment
  vars:
    # Every containers[] entry whose pod: value (default: its own name)
    # resolves to this group - one Pod-spec containers[] item per member.
    _zt_pod_group_members: "{{ _zt_containers | selectattr('pod_group', 'equalto', zt_pod_group) | list }}"
    # Union of all members' volumes:, deduped by name (first occurrence wins)
    # - matches the "declare the shared volume once, mount it from each
    # container that needs it" pattern. Omitted entirely when no member
    # declares any volumes, same as today's single-container case.
    _zt_pod_group_volumes: "{{ _zt_pod_group_members | map(attribute='volumes') | sum(start=[]) | unique(attribute='name') | list }}"
  kubernetes.core.k8s:
    host: "{{ zt_containers_openshift_api_url }}"
    api_key: "{{ zt_containers_openshift_api_key }}"
    validate_certs: "{{ zt_containers_validate_certs }}"
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ zt_pod_group }}"
        namespace: "{{ zt_containers_namespace }}"
        labels:
          guid: "{{ guid }}"
          app.kubernetes.io/name: "{{ zt_pod_group }}"
          creator: rhpds.zerotouch.zt_containers
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ zt_pod_group }}"
        template:
          metadata:
            labels:
              app.kubernetes.io/name: "{{ zt_pod_group }}"
              guid: "{{ guid }}"
          spec:
            containers: "{{ _zt_pod_group_members | map(attribute='k8s_spec') | list }}"
            volumes: "{{ _zt_pod_group_volumes if _zt_pod_group_volumes | length > 0 else omit }}"
  register: r_zt_containers_deploy
  retries: "{{ zt_containers_k8s_retries }}"
  delay: "{{ zt_containers_k8s_delay }}"
  until: r_zt_containers_deploy is not failed
  loop: "{{ _zt_containers | map(attribute='pod_group') | unique | list }}"
  loop_control:
    loop_var: zt_pod_group
    label: "{{ zt_pod_group }}"

- name: Wait for each pod group's Deployment to be Available
  when: zt_containers_wait_ready | bool
  kubernetes.core.k8s:
    host: "{{ zt_containers_openshift_api_url }}"
    api_key: "{{ zt_containers_openshift_api_key }}"
    validate_certs: "{{ zt_containers_validate_certs }}"
    api_version: apps/v1
    kind: Deployment
    name: "{{ zt_pod_group }}"
    namespace: "{{ zt_containers_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: "{{ zt_containers_wait_timeout }}"
  loop: "{{ _zt_containers | map(attribute='pod_group') | unique | list }}"
  loop_control:
    loop_var: zt_pod_group
    label: "{{ zt_pod_group }}"

- name: Create a Service for each container entry that declares one
  kubernetes.core.k8s:
    host: "{{ zt_containers_openshift_api_url }}"
    api_key: "{{ zt_containers_openshift_api_key }}"
    validate_certs: "{{ zt_containers_validate_certs }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ zt_pair[1].name }}"
        namespace: "{{ zt_containers_namespace }}"
        labels:
          guid: "{{ guid }}"
          creator: rhpds.zerotouch.zt_containers
      spec:
        # Selects the shared Pod-group label, not the individual container's
        # own name - once grouped via pod:, the Service must route to the
        # Pod (which may hold several containers), not a per-container label
        # that no longer exists on its own.
        selector:
          app.kubernetes.io/name: "{{ zt_pair[0].pod | default(zt_pair[0].name) }}"
        ports: "{{ zt_pair[1].ports }}"
  register: r_zt_containers_service
  retries: "{{ zt_containers_k8s_retries }}"
  delay: "{{ zt_containers_k8s_delay }}"
  until: r_zt_containers_service is not failed
  loop: "{{ containers | subelements('services', skip_missing=True) }}"
  loop_control:
    loop_var: zt_pair
    label: "{{ zt_pair[1].name }}"

- name: Create a Route for each container entry that declares one
  kubernetes.core.k8s:
    host: "{{ zt_containers_openshift_api_url }}"
    api_key: "{{ zt_containers_openshift_api_key }}"
    validate_certs: "{{ zt_containers_validate_certs }}"
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: "{{ zt_pair[1].name }}"
        namespace: "{{ zt_containers_namespace }}"
        labels:
          guid: "{{ guid }}"
          creator: rhpds.zerotouch.zt_containers
      spec:
        host: "{{ zt_pair[1].host }}-{{ guid }}.{{ sandbox_openshift_apps_domain }}"
        to:
          kind: Service
          name: "{{ zt_pair[1].service }}"
        port:
          targetPort: "{{ zt_pair[1].targetPort }}"
        tls: >-
          {{ {'termination': zt_pair[1].tls_termination | default('edge')}
             if zt_pair[1].tls | default(false) else omit }}
  register: r_zt_containers_route
  retries: "{{ zt_containers_k8s_retries }}"
  delay: "{{ zt_containers_k8s_delay }}"
  until: r_zt_containers_route is not failed
  loop: "{{ containers | subelements('routes', skip_missing=True) }}"
  loop_control:
    loop_var: zt_pair
    label: "{{ zt_pair[1].name }}"

- name: Find the pod for each container that declares init commands
  kubernetes.core.k8s_info:
    host: "{{ zt_containers_openshift_api_url }}"
    api_key: "{{ zt_containers_openshift_api_key }}"
    validate_certs: "{{ zt_containers_validate_certs }}"
    api_version: v1
    kind: Pod
    namespace: "{{ zt_containers_namespace }}"
    label_selectors:
      # Look up by the container's resolved pod-group label, not its own
      # name, since a grouped container's Pod is labeled after the group.
      - "app.kubernetes.io/name={{ zt_container.pod | default(zt_container.name) }}"
  register: r_zt_containers_pods
  retries: "{{ ((zt_containers_wait_timeout | int) / (zt_containers_k8s_delay | int)) | round(0, 'ceil') | int }}"
  delay: "{{ zt_containers_k8s_delay }}"
  until: >-
    r_zt_containers_pods.resources | default([])
    | selectattr('status.phase', 'equalto', 'Running') | list | length > 0
  loop: "{{ containers | selectattr('commands', 'defined') | list }}"
  loop_control:
    loop_var: zt_container
    label: "{{ zt_container.name }}"

- name: Run one-time init commands inside each container that declares them
  kubernetes.core.k8s_exec:
    host: "{{ zt_containers_openshift_api_url }}"
    api_key: "{{ zt_containers_openshift_api_key }}"
    validate_certs: "{{ zt_containers_validate_certs }}"
    namespace: "{{ zt_containers_namespace }}"
    pod: >-
      {{ ((r_zt_containers_pods.results
          | selectattr('zt_container.name', 'equalto', zt_pair[0].name)
          | first).resources
          | selectattr('status.phase', 'equalto', 'Running')
          | sort(attribute='metadata.creationTimestamp', reverse=true)
          | first).metadata.name }}
    container: "{{ zt_pair[0].name }}"
    # kubernetes.core.k8s_exec's `command` option is documented and enforced
    # as type: str (see its argspec()), not a list - passing a YAML list here
    # gets stringified by Ansible's own type coercion into a Python list
    # repr (e.g. "['/bin/sh', '-c', '...']") before the module ever sees it.
    # The module then calls shlex.split() on that mangled string itself, which
    # reliably fails with "No closing quotation" on any command containing
    # quotes (e.g. curl -d '{"key": "value"}') - confirmed live against a
    # real cluster with zt-ans-bu-dev-tools' gitea commands. Fix: pass a
    # single string built with Ansible's `quote` filter (shlex.quote), which
    # round-trips correctly through the module's own shlex.split() to yield
    # exactly ["/bin/sh", "-c", "<original command, verbatim>"].
    command: "/bin/sh -c {{ zt_pair[1] | quote }}"
  register: r_zt_containers_commands
  no_log: true
  retries: "{{ zt_containers_command_retries }}"
  delay: "{{ zt_containers_command_delay }}"
  until: r_zt_containers_commands is not failed
  loop: "{{ containers | subelements('commands', skip_missing=True) }}"
  loop_control:
    loop_var: zt_pair
    label: "{{ zt_pair[0].name }}"
