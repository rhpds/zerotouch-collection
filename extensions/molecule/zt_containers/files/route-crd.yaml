---
# Minimal, permissive, structural-only stand-in for OpenShift's real
# route.openshift.io/v1 Route CRD, installed into the test kind cluster so
# zt_containers' Route creation can be schema-validated by a real API
# server. This does NOT provide real routing/ingress behavior — kind has no
# router — see roles/zt_containers/README.md's "Known limitation".
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.route.openshift.io
spec:
  group: route.openshift.io
  names:
    kind: Route
    listKind: RouteList
    plural: routes
    singular: route
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
