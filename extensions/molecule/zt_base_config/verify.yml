---
# Runs as a separate ansible-playbook process from converge.yml. Relies on
# provisioner.config_options.defaults.fact_caching (jsonfile) in molecule.yml
# so the cacheable facts zt_base_config publishes actually persist here.
# This cross-process fact-cache dependency is specific to this Molecule
# scenario (converge/verify are two separate ansible-playbook runs) — the
# real cloud-vms-base deploy doesn't need it, since pre_infra and
# infrastructure_deployment run in one ansible-playbook process there (see
# roles/zt_base_config/README.md "Catalog wiring"). A failure here would
# still be a real signal that this role's cacheable facts are broken.
- name: Verify
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Assert the URL-construction logic produced the expected raw content path
      vars:
        _expected: https://raw.githubusercontent.com/rhpds/zt-ans-bu-eda-netbox/main/config/
      ansible.builtin.assert:
        that:
          - zt_base_config_git_config_directory | default('') == _expected
        fail_msg: >-
          Expected cached fact zt_base_config_git_config_directory to equal
          {{ _expected }}, got
          {{ zt_base_config_git_config_directory | default('UNDEFINED') }} —
          check that fact_caching persisted across the converge/verify boundary.

    - name: Assert the gitea sidecar was parsed out of containers
      ansible.builtin.assert:
        that:
          - containers | default([]) | selectattr('name', 'equalto', 'gitea') | list | length == 1
        fail_msg: "Expected a 'gitea' entry in containers, got: {{ containers | default('UNDEFINED') }}"

    - name: Assert networks/instances/lockdown-rule output facts are all present
      ansible.builtin.assert:
        that:
          - zero_touch_egress_lockdown_rules is defined
          - zero_touch_ingress_lockdown_rules is defined
          - instances is defined
          - networks is defined
        fail_msg: "One or more zt_base_config output facts did not persist via the fact cache."

    # zt-ans-bu-eda-netbox (this scenario's real fixture repo) tags every one
    # of its VMs AnsibleGroup: isolated only - the exact real-world case the
    # bastion-group fixup exists for (see roles/zt_base_config/README.md
    # "Bastion group fixup"). Assert the fixup actually ran against real
    # content, not just a synthetic unit-test shape.
    - name: Assert the first VM's AnsibleGroup tag was patched to include "bastions"
      vars:
        _first_vm_tags: "{{ (instances | default([]) | first).tags | default([]) }}"
        _first_vm_group: >-
          {{ (_first_vm_tags | selectattr('key', 'equalto', 'AnsibleGroup') | map(attribute='value') | list | first) | default('') }}
      ansible.builtin.assert:
        that:
          - instances | default([]) | length > 0
          - "'bastions' in _first_vm_group"
        fail_msg: >-
          Expected the first parsed VM's AnsibleGroup tag to include
          "bastions" (zt-ans-bu-eda-netbox tags it "isolated" only in the real
          content repo), got: {{ _first_vm_group | default('UNDEFINED') }}

    - name: Assert other VMs' AnsibleGroup tags were left untouched
      vars:
        _other_vm_tags: "{{ (instances | default([]))[1:] | map(attribute='tags', default=[]) | flatten }}"
        _other_vm_groups: "{{ _other_vm_tags | selectattr('key', 'equalto', 'AnsibleGroup') | map(attribute='value') | list }}"
      ansible.builtin.assert:
        that:
          - "'bastions' not in (_other_vm_groups | join(','))"
        fail_msg: >-
          Expected only the first VM to be patched with "bastions", but found
          it in a later VM's AnsibleGroup tag too: {{ _other_vm_groups }}
