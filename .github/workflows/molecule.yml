---
name: Molecule Tests

"on":
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
    branches:
    - main

jobs:
  molecule:
    name: Molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario:
        - zt_base_config
        - zt_containers
        - zt_security_lockdown

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: extensions/molecule/requirements.txt

    # kind and Docker ship preinstalled on ubuntu-latest runners
    # (see https://github.com/actions/runner-images), so zt_containers'
    # and zt_security_lockdown's own create.yml/destroy.yml can drive
    # `kind` directly with no extra setup step here.
    - name: Install Molecule and dependencies
      run: pip install -r extensions/molecule/requirements.txt

    - name: Run Molecule test (${{ matrix.scenario }})
      run: molecule test -s ${{ matrix.scenario }}
